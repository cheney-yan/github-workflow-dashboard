name: Bug report
description: Report something that is broken
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** include GitHub tokens or private repository data.
        For security issues, use SECURITY.md instead of a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker (GHCR image)
        - Docker (local build)
        - npm / local dev server
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 145 on Linux
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Remove tokens and private repository names before pasting.
      render: shell
