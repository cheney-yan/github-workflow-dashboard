name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  deploy:
    concurrency:
      group: 'cloudflare-pages-staging'
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://githubworkflows.aspyn.io
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Flowbite class list
        uses: actions/cache@v5
        with:
          path: .flowbite-react
          key: flowbite-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            flowbite-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site
        run: npm run build
      - name: Deploy to Cloudflare Pages using Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ops-github-workflows-dashboard
