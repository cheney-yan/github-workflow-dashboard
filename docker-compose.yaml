services:
  dashboard:
    image: ghcr.io/cheney-yan/github-workflow-dashboard:latest
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: github-workflow-monitor
    ports:
      # Bound for the TLS reverse proxy. Restrict this port at the host firewall
      # if the proxy runs on another machine.
      - "0.0.0.0:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${NEXT_CACHE_DIR:-./.next-cache}:/app/.next/cache
      - ${DATA_DIR:-./.data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
